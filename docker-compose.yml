services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst  # local demo database only
      POSTGRES_DB: superstore
    ports:
      - "5432:5432"
    volumes:
      - ./sql/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
