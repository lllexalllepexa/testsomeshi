# Run the DAG once inside the official Airflow image (Windows hosts cannot run Airflow natively).
#   docker compose -f docker-compose.airflow.yml run --rm airflow-dag-test
# The pipeline's packages are installed without the pins from requirements.txt: the Airflow image
# ships its own constrained versions (for example SQLAlchemy < 2), and the pipeline does not need them pinned.

services:
  airflow-dag-test:
    image: apache/airflow:2.10.4-python3.12
    environment:
      AIRFLOW_HOME: /home/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /project/dags
      AIRFLOW_PROJECT_ROOT: /project
      PYTHONPATH: /project
    volumes:
      - ./:/project
    working_dir: /project
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        pip install --quiet duckdb pyarrow python-calamine scipy statsmodels matplotlib
        airflow db migrate
        airflow dags test superstore_etl $${LOGICAL_DATE:-2024-01-01}
